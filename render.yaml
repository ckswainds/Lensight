# Optional Render.com blueprint — https://render.com/docs/blueprint-spec
# Railway: ignore this file; in Railway set the service to 1 replica (Scaling) and
# use start command: python -m uvicorn dashboard.app:fastapi_app --host 0.0.0.0 --port $PORT
# Same rule: numInstances / replicas should stay 1 unless every instance shares data/ on disk.

services:
  - type: web
    name: lensight
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn dashboard.app:fastapi_app --host 0.0.0.0 --port $PORT --workers 1

    numInstances: 1
